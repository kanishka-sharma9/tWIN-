[project]
name = "multiid-folder-mgmt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kanishka-sharma9", email = "kanishka.sharma891@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
multiid-folder-mgmt = "multiid_folder_mgmt:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]

[tool.ruff.lint]
extend-select = [
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "FAST",  # FastAPI
    "I",     # isort
    "PT",    # flake8-pytest-style
    "RUF",   # Ruff-specific
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
