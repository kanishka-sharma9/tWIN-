services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twin}
      POSTGRES_DB: ${POSTGRES_DB:-twin}
    ports:
      # Bound to localhost so the database is not reachable from other machines.
      - "127.0.0.1:5432:5432"
    volumes:
      - twin_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  twin_pgdata:
