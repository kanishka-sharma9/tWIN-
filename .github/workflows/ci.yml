name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: twin
          POSTGRES_PASSWORD: twin
          POSTGRES_DB: twin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twin -d twin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TWIN_DATABASE_URL: postgresql+psycopg://twin:twin@127.0.0.1:5432/twin
    steps:
      - uses: actions/checkout@v7

      # Installs uv; `uv sync` then fetches the Python pinned in backend/.python-version.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check --output-format=github
      - run: uv run ty check --output-format=github
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # frontend/ arrives with E01-S04; until then this job passes without doing anything.
      - id: detect
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::frontend/package.json not found; skipping frontend checks"
          fi

      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: steps.detect.outputs.present == 'true'
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        run: npx biome ci --reporter=github
      - if: steps.detect.outputs.present == 'true'
        run: npx eslint .
      - if: steps.detect.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.detect.outputs.present == 'true'
        run: npm test
      - if: steps.detect.outputs.present == 'true'
        run: npm run build
