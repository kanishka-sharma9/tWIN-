name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs uv; `uv sync` then fetches the Python pinned in .python-version.
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check --output-format=github
      - run: uv run ty check --output-format=github
      - run: uv run mypy
      - run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # web/ arrives with E01-S04; until then this job passes without doing anything.
      - id: detect
        working-directory: .
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::web/package.json not found; skipping frontend checks"
          fi

      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - if: steps.detect.outputs.present == 'true'
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        run: npx biome ci --reporter=github
      - if: steps.detect.outputs.present == 'true'
        run: npx eslint .
      - if: steps.detect.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.detect.outputs.present == 'true'
        run: npm test
      - if: steps.detect.outputs.present == 'true'
        run: npm run build
